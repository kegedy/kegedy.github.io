<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="EDA File Viewer">
        <meta name="keywords" content="eda">
        <title>KWeb GDS File Viewer</title>
        <link rel="stylesheet" href={{ url_for("kweb_static", path="/bootstrap/bootstrap.min.css") }}>
    </link>
    <link rel="stylesheet" href={{ url_for("kweb_static", path="/custom.css") }}>
    <script type="text/javascript" src={{ url_for("kweb_static", path="/bootstrap/bootstrap.bundle.min.js") }}></script>
</link>
<link rel="icon" type="image/png" href={{ url_for("kweb_static", path="img/kweb.png") }}>
<style>
    /* Layer panel on the left, always shown */
    #layout { flex-wrap: nowrap; }
    #rightpanel { order: -1; flex: 0 0 260px; max-width: 260px; }
    /* Bottom-right stack: Clear Rulers / Zoom Fit (kweb's #menu, moved here).
       Column is as wide as its widest button; every button stretches to that width. */
    #corner-controls { position: absolute; bottom: 0.75rem; right: 0.75rem; z-index: 10;
                       display: flex; flex-direction: column; align-items: stretch; gap: 0.5rem;
                       width: max-content; }
    #menu { display: flex; flex-direction: column; gap: 0.5rem; padding: 0 !important; flex: none; width: auto; }
    #corner-controls .btn { margin: 0 !important; width: 100%; padding: 0.25rem 0.5rem;
                            font-size: 0.875rem; border-radius: var(--bs-border-radius-sm); }
    /* kweb's Reload button (re-reads the file from disk) isn't useful on the hosted site */
    #reload { display: none !important; }
    /* Hide the "move" mode (it moves shapes, which a read-only viewer doesn't need) */
    #btnradiomove, label[for="btnradiomove"] { display: none !important; }
    /* Inactive mode button (e.g. "ruler") is transparent by default and vanishes over the drawing */
    #mode-row .btn-check:not(:checked) + .btn { background: rgba(0, 0, 0, 0.85); color: #ccc; }
    /* Layer panel (built by the script at the bottom, replacing kweb's) */
    .layer-toolbar { display: flex; flex-direction: column; gap: 0.4rem; padding: 0.5rem 0.25rem; }
    .layer-toolbar .form-check { margin: 0; }
    .layer-row { display: flex; align-items: center; gap: 0.4rem; padding: 0.1rem 0.25rem;
                 border-radius: 4px; cursor: default; user-select: none; }
    .layer-row:hover { background: var(--bs-tertiary-bg); }
    .layer-row .form-check-input { margin: 0; flex: none; cursor: pointer; }
    .layer-row img { width: 36px; height: 18px; flex: none; cursor: pointer; }
    .layer-row .layer-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .layer-row.is-hidden img, .layer-row.is-hidden .layer-name { opacity: 0.4; }
    .layer-row.is-selected, .layer-row.is-selected:hover {
        background: rgba(var(--bs-info-rgb), 0.25); box-shadow: inset 3px 0 0 var(--bs-info); }
    .layer-group > .layer-row { font-weight: 600; }
    .layer-group > .layer-children { padding-left: 1rem; }
    /* Let clicks/drags pass through the empty parts of the overlay to the canvas */
    #floating-buttons, #floating-buttons > div { pointer-events: none; }
    #floating-buttons > div > * { pointer-events: auto; }
</style>
</head>
<body>
    <div class="container-fluid h-100" id="viewer-panel">
        <div class="row h-100 p-2" id="layout">
            <div class="col rounded shadow d-flex flex-column position-relative h-100 ps-1 pe-0"
                 id="layout-view">
                <div id="corner-controls"></div>
                <canvas class="rounded shadow canvas-container h-100 w-100"
                        style="min-width: 100px;
                               min-height: 100px"
                        id="layout_canvas"></canvas>
                <div class="position-absolute top-0 start-1 p-4 row w-100 overflow-hidden"
                     id="floating-buttons">
                    <div id="modes" class="col m-0"></div>
                    <div id="menu" class="col m-0 px-2 text-end"></div>
                </div>
            </div>
            <div id="rightpanel"
                 role="tablist"
                 class="rounded shadow bg-default overflow-auto h-100 p-0 pe-1">
                <ul class="nav nav-tabs" id="navigator" role="tablist">
                    <li class="nav-item">
                        <button class="nav-link active"
                                id="layers-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#layers-tab-pane"
                                type="button"
                                role="tab"
                                aria-controls="layers-tab-pane"
                                aria-selected="true">Layers</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link"
                                id="cells-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#cells-tab-pane"
                                type="button"
                                role="tab"
                                aria-controls="cells-tab-pane"
                                aria-selected="false">Cells</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link"
                                id="metainfo-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#metainfo-tab-pane"
                                type="button"
                                role="tab"
                                aria-controls="metainfo-tab-pane"
                                aria-selected="false"
                                hidden>Cell MetaInfo</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link"
                                id="rdb-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#rdb-tab-pane"
                                type="button"
                                role="tab"
                                aria-controls="rdb-tab-pane"
                                aria-selected="false"
                                hidden>RDB</button>
                    </li>
                </ul>
                <div class="tab-content" id="rightpanel-content">
                    <div class="tab-pane fade show active"
                         id="layers-tab-pane"
                         role="tabpanel"
                         aria-labelledby="layers-tab"
                         tabindex="0">
                        <div id="layer-buttons">
                            <div class="form-check form-switch ps-2">
                                <input class="form-check-input ms-0 ps-0"
                                       type="checkbox"
                                       role="switch"
                                       id="layerEmptySwitch"
                                       checked>
                                <label class="form-check-label ps-2" for="layerEmptySwitch">Hide Empty Layers</label>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade"
                         id="cells-tab-pane"
                         role="tabpanel"
                         aria-labelledby="cells-tab"
                         tabindex="0"></div>
                    <div class="tab-pane fade"
                         id="metainfo-tab-pane"
                         role="tabpanel"
                         aria-labelledby="metainfo-tab"
                         tabindex="0"></div>
                    <div class="tab-pane fade"
                         id="rdb-tab-pane"
                         role="tabpanel"
                         aria-labelledby="rdb-tab"
                         tabindex="0">
                        <div class="position-relative">
                            <div class="form-floating my-1">
                                <input type="text"
                                       class="form-control z-0"
                                       id="rdbCategory"
                                       oninput="filterCategories(this);"
                                       onfocus="categoryFocus(event);"
                                       onfocusout="categoryFocusOut(event);"
                                       placeholder="...">
                                <label class="z-0" for="floatingInput">Filter by Category</label>
                            </div>
                            <select class="form-select position-absolute bottom-end-0 z-2 bg-light-subtle"
                                    onchange="selectCategory(event)"
                                    size="5"
                                    id="rdbCategoryOptions"
                                    onfocusout="categoryFocusOut(event);"
                                    hidden></select>
                        </div>
                        <div class="position-relative">
                            <div class="form-floating my-1">
                                <input type="text"
                                       class="form-control z-0"
                                       id="rdbCell"
                                       oninput="filterCells(this);"
                                       onfocus="cellFocus(event);"
                                       onfocusout="cellFocusOut(event);"
                                       placeholder="...">
                                <label class="z-0" for="floatingPassword">Filter by Cell</label>
                            </div>
                            <select class="form-select position-absolute bottom-end-0 z-2 bg-light-subtle"
                                    onchange="selectCell(event);"
                                    size="5"
                                    id="rdbCellOptions"
                                    onfocusout="cellFocusOut(event);"
                                    hidden></select>
                        </div>
                        <select class="form-select my-1"
                                onchange="requestItemDrawings();"
                                multiple
                                id="rdbItems"></select>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>var ws_url="{{ url }}"; var params = new URLSearchParams({{ params | tojson | safe }})</script>
    <script type="text/javascript" src={{ url_for("kweb_static", path="viewer.js") }}></script>
    <script>
        // viewer.js fills #menu by id, so it still works after the move
        document.getElementById("corner-controls").prepend(document.getElementById("menu"));

        // viewer.js's appendCells (Cells tab) reads a global `addpaddings` that only existed
        // as a side effect of kweb's showLayers, which is replaced below. Define it explicitly.
        var addpaddings = true;

        // KLayout-style layer panel. Replaces kweb's showLayers/updateLayerImages and talks
        // to the server with its existing messages: layer-v (one layer), layer-v-all (all).
        (function () {
            const pane = document.getElementById("layers-tab-pane");
            pane.innerHTML = `
                <div class="layer-toolbar">
                    <input type="search" class="form-control form-control-sm" id="layer-filter"
                           placeholder="Filter layers…" aria-label="Filter layers">
                    <div class="btn-group btn-group-sm" role="group" aria-label="Layer visibility">
                        <button type="button" class="btn btn-outline-secondary" data-action="all">Show all</button>
                        <button type="button" class="btn btn-outline-secondary" data-action="none">Hide all</button>
                        <button type="button" class="btn btn-outline-secondary" data-action="invert">Invert</button>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" role="switch" id="layerEmptySwitch" checked>
                        <label class="form-check-label" for="layerEmptySwitch">Hide empty layers</label>
                    </div>
                </div>
                <div id="layer-list"></div>`;

            const list = document.getElementById("layer-list");
            const filterInput = document.getElementById("layer-filter");
            const emptySwitch = document.getElementById("layerEmptySwitch");

            let layers = [];
            const byId = new Map();     // id -> layer
            const parentOf = new Map(); // id -> parent group layer
            let selected = new Set();   // ids of selected (highlighted) layer rows

            function index(items, parent) {
                items.forEach(l => {
                    byId.set(l.id, l);
                    if (parent) parentOf.set(l.id, parent);
                    if (l.children) index(l.children, l);
                });
            }

            function label(l) { return l.name || l.s; }

            function matches(l) {
                const q = filterInput.value.trim().toLowerCase();
                return !q || label(l).toLowerCase().includes(q) || l.s.toLowerCase().includes(q);
            }

            // Leaf layers currently shown in the list (respects filter and hide-empty)
            function listedLeaves(items = layers, out = []) {
                items.forEach(l => {
                    if (emptySwitch.checked && l.empty) return;
                    if (l.children) listedLeaves(l.children, out);
                    else if (matches(l)) out.push(l);
                });
                return out;
            }

            function setVisible(l, v) {
                l.v = v;
                socket.send(JSON.stringify({ msg: "layer-v", id: l.id, value: v }));
            }

            function setAll(v) {
                byId.forEach(l => { l.v = v; });
                socket.send(JSON.stringify({ msg: "layer-v-all", value: v }));
            }

            function showOnly(l) {
                setAll(false);
                for (let p = parentOf.get(l.id); p; p = parentOf.get(p.id)) setVisible(p, true);
                setVisible(l, true);
                render();
            }

            // True when `l` is the only visible (leaf) layer
            function isOnlyVisible(l) {
                if (!l.v) return false;
                for (const other of byId.values()) {
                    if (other !== l && !other.children && other.v) return false;
                }
                return true;
            }

            // Double-click: show only this layer; double-click it again to show all layers
            function toggleOnly(l) {
                if (isOnlyVisible(l)) {
                    setAll(true);
                    render();
                } else {
                    showOnly(l);
                }
            }

            function row(l) {
                const r = document.createElement("div");
                r.className = "layer-row" + (l.v ? "" : " is-hidden")
                    + (selected.has(l.id) ? " is-selected" : "");
                r.dataset.id = l.id;
                r.title = l.s;
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.className = "form-check-input";
                cb.checked = l.v;
                cb.setAttribute("aria-label", "Show " + label(l));
                cb.addEventListener("change", () => { setVisible(l, cb.checked); render(); });
                const img = document.createElement("img");
                img.id = "layer-img-" + l.id;
                img.src = "data:image/png;base64," + l.img;
                img.alt = "";
                img.addEventListener("click", () => { setVisible(l, !l.v); render(); });
                const name = document.createElement("span");
                name.className = "layer-name";
                name.textContent = label(l);
                r.append(cb, img, name);
                // Click selects (Ctrl/Cmd-click adds/removes); checkbox and swatch only toggle visibility.
                // Classes are updated in place, not re-rendered, so a following dblclick still lands.
                r.addEventListener("click", e => {
                    if (e.target === cb || e.target === img) return;
                    if (e.ctrlKey || e.metaKey) {
                        if (!selected.delete(l.id)) selected.add(l.id);
                    } else {
                        selected = new Set([l.id]);
                    }
                    applySelection();
                });
                r.addEventListener("dblclick", e => {
                    if (e.target !== cb) toggleOnly(l);
                });
                return r;
            }

            function build(items, parent) {
                items.forEach(l => {
                    if (emptySwitch.checked && l.empty) return;
                    if (l.children) {
                        const g = document.createElement("div");
                        g.className = "layer-group";
                        const kids = document.createElement("div");
                        kids.className = "layer-children";
                        build(l.children, kids);
                        if (!kids.childElementCount) return;
                        g.append(row(l), kids);
                        parent.appendChild(g);
                    } else if (matches(l)) {
                        parent.appendChild(row(l));
                    }
                });
            }

            // Update highlight classes in place (re-rendering would break a following dblclick)
            function applySelection() {
                list.querySelectorAll(".layer-row").forEach(el =>
                    el.classList.toggle("is-selected", selected.has(+el.dataset.id)));
            }

            // Shapes selected on the canvas: highlight their layers (sent by app.py)
            socket.addEventListener("message", e => {
                if (typeof e.data !== "string") return;
                const js = JSON.parse(e.data);
                if (js.msg !== "selection-layers") return;
                selected = new Set(js.ids);
                applySelection();
                const first = list.querySelector(".layer-row.is-selected");
                if (first) first.scrollIntoView({block: "nearest"});
            });

            function render() {
                const scroll = pane.parentElement.scrollTop;
                list.replaceChildren();
                build(layers, list);
                pane.parentElement.scrollTop = scroll;
            }

            pane.querySelector(".btn-group").addEventListener("click", e => {
                const action = e.target.dataset.action;
                if (action === "all") setAll(true);
                else if (action === "none") setAll(false);
                else if (action === "invert") listedLeaves().forEach(l => setVisible(l, !l.v));
                else return;
                render();
            });
            filterInput.addEventListener("input", render);
            emptySwitch.addEventListener("change", render);

            // Called by viewer.js on "loaded" and "reloaded"
            window.showLayers = function (newLayers) {
                // The server's view size can be stale after a (re)load, which renders a tiny
                // image in the corner. Clearing viewer.js's cached size makes its 10 ms
                // resize poll send the real canvas size again.
                lastCanvasWidth = 0;
                lastCanvasHeight = 0;
                layers = newLayers;
                byId.clear();
                parentOf.clear();
                index(layers);
                render();
            };

            // Called by viewer.js on "layer-u" (server's echo after a layer-v). Take the new swatch
            // image but not `v`: echoes can arrive after newer local changes (quick clicks, network
            // latency) and would revert them. Visibility only changes here, and "reloaded" resends all.
            window.updateLayerImages = function (updated) {
                (function apply(items) {
                    items.forEach(u => {
                        const l = byId.get(u.id);
                        if (l) Object.assign(l, u, {v: l.v});
                        if (u.children) apply(u.children);
                    });
                })(updated);
                render();
            };
        })();

    </script>
</body>
</html>
