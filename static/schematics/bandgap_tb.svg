<text fill="#cccccc"  xml:space="preserve" font-size="20.2288" transform="translate(14.4736, 210.178)" >Bandgap testbench: the core as a single cell with external sources</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" transform="translate(14.4736, 233.952)" >VDD carries DC + AC 1 so the same bench runs op, DC, AC (PSRR) and noise.</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" transform="translate(14.4736, 247.873)" >The decks in sim/bandgap/ reuse this bench for every test.</text>
<text fill="#00ccee"  xml:space="preserve" font-size="13.351" transform="translate(113.638, 386.276) rotate(270)" >VDD</text>
<text fill="#00ccee"  xml:space="preserve" font-size="8.0915" transform="translate(113.672, 467.577)" >GND</text>
