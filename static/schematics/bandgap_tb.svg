<text fill="#cccccc"  xml:space="preserve" font-size="8.0915" transform="translate(123.398, 394.637)" >VSUP</text>
<text fill="#cccccc"  xml:space="preserve" font-size="8.0915" transform="translate(123.398, 414.088)" >DC {vdd} AC 1 PWL(0 0 {tr} {vdd})</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" transform="translate(314.015, 395.782)" >bandgap_core</text>
<text fill="#cccccc"  xml:space="preserve" font-size="10.1144" transform="translate(415.159, 368.27)" >x1</text>
<text fill="#cccccc"  xml:space="preserve" font-size="8.0915" transform="translate(360.697, 366.433)" >VDD</text>
<text fill="#cccccc"  xml:space="preserve" font-size="8.0915" transform="translate(360.697, 424.785)" >VSS</text>
<text fill="#cccccc"  xml:space="preserve" font-size="8.0915" transform="translate(384.644, 389.774)" >VREF</text>
<text fill="#aaaa00"  xml:space="preserve" font-size="8.0915" transform="translate(503.422, 427.703)" >1</text>
<text fill="#aaaa00"  xml:space="preserve" font-size="8.0915" transform="translate(503.422, 460.769)" >2</text>
<text fill="#cccccc"  xml:space="preserve" font-size="8.0915" transform="translate(524.083, 433.538)" >CL</text>
