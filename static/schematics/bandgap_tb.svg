<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 261.183)" >.lib $::SKYWATER_MODELS/sky130.lib.spice tt</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 275.104)" >.param vdd=1.8 tr=10u</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 289.026)" >.temp 27</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" transform="translate(640.787, 358.436)" >CONTROL</text>
