<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 391.809)" >save all</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 405.73)" >op</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 419.651)" >print v(vref) i(vsup)</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 433.573)" >dc temp -40 125 1</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 447.494)" >plot v(vref)</text>
<text fill="#cccccc"  xml:space="preserve" font-size="12.1373" style="font-family:Monospace;" transform="translate(648.567, 461.416)" >.endc</text>
