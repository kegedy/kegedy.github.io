<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>KE</title>
  <!-- Thin-line KE in a ring; the E's middle bar runs out and joins the ring -->
  <rect width="512" height="512" rx="72" fill="#000"/>

  <g fill="none" stroke="#fff" stroke-width="24" stroke-linejoin="miter" stroke-linecap="butt">
    <circle cx="256" cy="256" r="188"/>
    <!-- K spine -->
    <line x1="160" y1="142" x2="160" y2="370"/>
    <!-- E top bar, K arms, E bottom bar -->
    <polyline points="364,154 296,154 194,256 296,358 364,358"/>
    <!-- E middle bar, joining the ring -->
    <line x1="232" y1="256" x2="440" y2="256"/>
  </g>
</svg>
